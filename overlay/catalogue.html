<!doctype html><html lang="fr"><meta charset="utf-8"><title>Catalogue des boss</title><style>body{background:#131510;color:#eee2c2;font:16px system-ui;margin:24px}input,select{padding:9px;margin:5px;background:#24271d;color:inherit;border:1px solid #8e7949}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{text-align:left;border-bottom:1px solid #494c3c;padding:10px}th{position:sticky;top:0;background:#24271d}small{color:#c2b994}#summary{padding:12px 0}tr.unknown{opacity:.65}</style><h1 id="title">Catalogue des boss</h1><input id="search" placeholder="Rechercher un boss ou un lieu"><select id="content"><option value="all">Tous les contenus</option><option value="base_game">Jeu de base</option><option value="dlc">Shadow of the Erdtree</option></select><select id="state"><option value="all">Tous les etats</option><option value="true">Vaincu</option><option value="false">Non vaincu</option><option value="null">N/A</option></select><div id="summary"></div><small id="status"></small><table><thead><tr><th id="hboss">Boss</th><th id="hplace">Lieu</th><th id="hregion">Region</th><th id="hstate">Etat</th><th id="htime">Temps du challenge</th></tr></thead><tbody id="rows"></tbody></table><script>
let data=null,busy=false;const $=id=>document.getElementById(id);function render(){if(!data)return;const t=k=>data.ui?.[k]||k;document.documentElement.lang=data.language||'fr';document.title=t('Catalogue des boss');$('title').textContent=t('Catalogue des boss');$('search').placeholder=t('Rechercher un boss ou un lieu');$('content').options[0].text=t('Tous les contenus');$('content').options[1].text=t('Jeu de base');$('state').options[0].text=t('Tous les etats');$('state').options[1].text=t('Vaincu');$('state').options[2].text=t('Non vaincu');for(const[id,key]of [['hboss','Boss'],['hplace','Lieu'],['hregion','Region'],['hstate','Etat'],['htime','Temps du challenge']])$(id).textContent=t(key);const rows=data.bosses||[],q=$('search').value.toLocaleLowerCase(),content=$('content').value,state=$('state').value;const selected=rows.filter(b=>(content==='all'||b.content===content)&&(state==='all'||String(b.state)===state)&&[b.name,b.place,b.region].some(v=>v.toLocaleLowerCase().includes(q)));const fragment=document.createDocumentFragment();for(const b of selected){const tr=document.createElement('tr');if(b.state===null)tr.className='unknown';for(const value of [b.name,b.place,b.region,b.status,b.time||'N/A']){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}fragment.appendChild(tr)}$('rows').replaceChildren(fragment);$('summary').textContent=t('Suivis')+': '+rows.length+' | '+t('Vaincus connus')+': '+rows.filter(b=>b.state===true).length+' | '+t('Etats inconnus')+': '+rows.filter(b=>b.state===null).length+' | '+selected.length; $('status').textContent=data.status||''}for(const id of ['search','content','state'])$(id).addEventListener('input',render);async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP');data=await r.json();render()}catch(e){$('status').textContent=(data?.ui?.['Actualisation impossible']||'Actualisation impossible')}finally{busy=false}}refresh();setInterval(refresh,1000);
</script></html>
